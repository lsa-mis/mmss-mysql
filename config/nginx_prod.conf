  # Define where to look for the socket file of the Puma server
upstream puma {
    server unix:///home/deployer/apps/mmss-mysql/shared/tmp/sockets/mmss-mysql-puma.sock;
}

# The recommender upload link carries a bearer token in the query string
# (/recuploads/new?token=...). Rails filters it from its own logs; the access log must not keep
# it either. Under /recuploads the whole query string is dropped from the logged request line —
# matching one spelling of the key would miss percent-encoded variants (?to%6ben=...) that
# Rails still decodes. The endpoint decision uses the normalized $uri (the same value location
# matching uses), so an encoded path such as /%72ecuploads/new is covered too. Elsewhere a
# literal token= value is redacted as a courtesy. Referers lose their query string altogether:
# only our own pages (the upload form, the success/error pages it redirects to) carry a token
# there, and external Referer query strings have no value for this application.
map $uri $under_recuploads {
    "~*^/recuploads(?:/|$)"  1;
    default                  0;
}
map "$under_recuploads:$request_uri" $redacted_request_uri {
    "~^1:(?<path>[^?]*)\?.*$"                    "${path}?[QUERY-REDACTED]";
    "~^1:(?<path>[^?]*)$"                        $path;
    "~^0:(?<pre>.*[?&]token=)[^&]*(?<post>.*)$"  "${pre}[REDACTED]${post}";
    default                                      $request_uri;
}
map $http_referer $redacted_referer {
    "~^(?<origin>[^?]*)\?.*$"  "${origin}?[QUERY-REDACTED]";
    default                    $http_referer;
}
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $redacted_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$redacted_referer" "$http_user_agent"';

  # the last server block redirects all HTTP traffic to HTTPS: The first server block listens on port
  # 80 (HTTP) and redirects all requests to HTTPS using a 301 status code, which
  # is a permanent redirect. This is done for your specified domain names.

# HTTPS server configuration
server {
  server_name mathmmssapp2.miserver.it.umich.edu mmss-registration.math.lsa.umich.edu;

    listen 443 ssl http2;  # managed by Certbot
    listen [::]:443 ssl http2 ipv6only=on;  # managed by Certbot

    ssl_certificate /etc/letsencrypt/live/mathmmssapp2.miserver.it.umich.edu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mathmmssapp2.miserver.it.umich.edu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

  root /home/deployer/apps/mmss-mysql/current/public;

  # Puma application server configuration
  location @puma {
      proxy_pass http://puma;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Ssl on; # Optional
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
  }

  location / {
      try_files $uri/index.html $uri @puma;
  }

  # The recommender upload endpoint: error_log entries cannot be redacted and include the request
  # line (with the token) for upstream failures, so only critical errors are logged here. It
  # proxies directly (no try_files -> @puma, whose error_log level would apply instead); there
  # are no static files under /recuploads.
  location ^~ /recuploads {
      error_log /home/deployer/apps/mmss-mysql/current/log/nginx.error.log crit;
      proxy_pass http://puma;
      # The upload form posts back from the token-bearing URL; forward the Referer without its
      # query string so the token never reaches the app's logs or error reporting.
      proxy_set_header Referer $redacted_referer;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Ssl on;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
  }

  # Additional configurations (e.g., logging, error pages) as needed
  access_log /home/deployer/apps/mmss-mysql/current/log/nginx.access.log redacted;
  error_log /home/deployer/apps/mmss-mysql/current/log/nginx.error.log info;


}

server {
    if ($host = mathmmssapp2.miserver.it.umich.edu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = mmss-registration.math.lsa.umich.edu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

  listen 80;
  listen [::]:80;
  server_name mathmmssapp2.miserver.it.umich.edu mmss-registration.math.lsa.umich.edu;
  # Redirected HTTP requests carry the same query string; log them redacted too.
  access_log /home/deployer/apps/mmss-mysql/current/log/nginx.access.log redacted;
    return 404; # managed by Certbot


}