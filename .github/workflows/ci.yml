name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RAILS_ENV: test
  NODE_ENV: test
  # webpack 4 needs the legacy OpenSSL provider on Node >= 17 (see bin/webpack).
  NODE_OPTIONS: --openssl-legacy-provider
  # Merged over the `test` entry in config/database.yml; points at the service container.
  DATABASE_URL: mysql2://root:root@127.0.0.1:3306/mmss-mysql_test
  # Rails only requires the default + test groups under RAILS_ENV=test.
  BUNDLE_WITHOUT: development:staging

jobs:
  rspec:
    name: RSpec (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MySQL client headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libmysqlclient-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Reads .ruby-version (3.4.9); installs and caches the bundle.
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Cache compiled webpack packs
        uses: actions/cache@v4
        with:
          path: |
            public/packs-test
            tmp/cache/webpacker
          key: packs-test-${{ runner.os }}-${{ hashFiles('yarn.lock', 'package.json', 'config/webpacker.yml', 'config/webpack/**', 'babel.config.js', 'postcss.config.js', 'tailwind.config.js', '.browserslistrc', 'app/javascript/**') }}
          restore-keys: |
            packs-test-${{ runner.os }}-

      - name: Compile webpack packs
        # Request specs render layouts through Webpacker, so the test manifest
        # must exist before RSpec runs. Webpacker skips this when the cache is fresh.
        run: bin/rails webpacker:compile

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Run RSpec (excluding system specs)
        run: bundle exec rspec --exclude-pattern "spec/system/**/*" --format progress

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplecov-coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7
